name: Build TimerGuru

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf src_proj
          mkdir src_proj
          unzip -q app.zip -d src_proj
          ls src_proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: src_proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Copy APK
        run: cp src_proj/app/build/outputs/apk/debug/app-debug.apk TimerGuru.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TimerGuru-apk
          path: TimerGuru.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TimerGuru latest
          files: TimerGuru.apk
